<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atrapa al Gatito 🐱</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>🐱 Atrapa al Gatito 🐱</h1>

        <p>¡Haz clic en el gatito para atraparlo!</p>

        <div class="informacion">
            <span>⭐ Puntos: <b id="puntos">0</b></span>
            <span>⏱️ Tiempo: <b id="tiempo">30</b></span>
        </div>

        <div id="juego">
            <div id="gatito">🐱</div>
        </div>

        <button id="iniciar">¡EMPEZAR JUEGO!</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
